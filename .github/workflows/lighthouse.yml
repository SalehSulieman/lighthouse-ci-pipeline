name: Lighthouse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse-test:
    name: Run Lighthouse CI & Send Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse & Save JSON
        run: lhci collect --url="https://lighthouse-ci-pipeline.vercel.app"

      - name: Extract Data, Send to Backend, and Enforce Budgets
        run: |
          # 1. Find the generated JSON file
          JSON_FILE=$(ls .lighthouseci/lhr-*.json | head -n 1)

          # 2. Extract metrics
          FCP=$(jq '.audits["first-contentful-paint"].numericValue / 1000' $JSON_FILE)
          LCP=$(jq '.audits["largest-contentful-paint"].numericValue / 1000' $JSON_FILE)
          TBT=$(jq '.audits["total-blocking-time"].numericValue' $JSON_FILE)

          # 3. Get GitHub metadata
          COMMIT_HASH=${{ github.sha }}
          BRANCH_NAME=${{ github.ref_name }}

          # 4. SEND DATA
          curl -X POST "https://performance-api-1.onrender.com/metrics" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
          -d '{
            "commit_hash": "'"$COMMIT_HASH"'",
            "branch": "'"$BRANCH_NAME"'",
            "environment": "production",
            "fcp": '"$FCP"',
            "lcp": '"$LCP"',
            "tbt": '"$TBT"'
          }'

          echo ""
          echo "Data sent to backend. Evaluating Performance Gates..."

          # 5. PERFORMANCE BUDGET GATES
          FAILED=0

          if [ "$(awk "BEGIN {print ($FCP > 2.0)}")" -eq 1 ]; then
            echo "::error title=Performance Gate Failed::First Contentful Paint is too slow ($FCP s). Target is < 2.0 s."
            FAILED=1
          fi
          
          if [ "$(awk "BEGIN {print ($TBT > 500)}")" -eq 1 ]; then
            echo "::error title=Performance Gate Failed::Total Blocking Time is too high ($TBT ms). Target is < 500 ms."
            FAILED=1
          fi

          # 6. ENFORCE THE BLOCK
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Performance budgets exceeded. Blocking the CI pipeline."
            exit 1
          else
            echo "✅ All performance budgets passed!"
          fi
