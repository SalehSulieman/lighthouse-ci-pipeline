name: Lighthouse CI Pipeline

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

jobs:
  lighthouse-test:
    name: Run Lighthouse CI & Send Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli

      # ADDED: The Vercel Buffer
      - name: Wait for Vercel Deployment
        run: |
          echo "Waiting 90 seconds for Vercel to finish deploying the new code..."
          sleep 90

      - name: Run Lighthouse & Save JSON
        run: lhci collect --url="https://ppv.to"

      - name: Extract Data, Send to Backend, and Enforce Budgets
        run: |
          JSON_FILE=$(ls .lighthouseci/lhr-*.json | head -n 1)

          FCP=$(jq '.audits["first-contentful-paint"].numericValue / 1000' $JSON_FILE)
          LCP=$(jq '.audits["largest-contentful-paint"].numericValue / 1000' $JSON_FILE)
          TBT=$(jq '.audits["total-blocking-time"].numericValue' $JSON_FILE)

          echo "===== LIGHTHOUSE METRICS ====="
          echo "FCP: $FCP"
          echo "LCP: $LCP"
          echo "TBT: $TBT"
          echo "=============================="

          COMMIT_HASH=${{ github.sha }}
          BRANCH_NAME=${{ github.ref_name }}


          # Dynamic Environment Routing based on Branch Name
          if [ "$BRANCH_NAME" = "main" ]; then
            ENVIRONMENT="production"
          elif [ "$BRANCH_NAME" = "staging" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="development"
          fi

          echo "Detected Branch: $BRANCH_NAME. Routing data to $ENVIRONMENT environment."

          curl -X POST "https://performance-api-1.onrender.com/metrics" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
          -d '{
            "commit_hash": "'"$COMMIT_HASH"'",
            "branch": "'"$BRANCH_NAME"'",
            "environment": "'"$ENVIRONMENT"'",
            "fcp": '"$FCP"',
            "lcp": '"$LCP"',
            "tbt": '"$TBT"'
          }'

          echo ""
          echo "Data sent to backend. Evaluating Performance Gates..."

          FAILED=0

          if [ "$(awk "BEGIN {print ($FCP > 3.0)}")" -eq 1 ]; then
            echo "::error title=Performance Gate Failed::First Contentful Paint is too slow ($FCP s). Target is < 3.0 s."
            FAILED=1
          fi

          if [ "$(awk "BEGIN {print ($TBT > 500)}")" -eq 1 ]; then
            echo "::error title=Performance Gate Failed::Total Blocking Time is too high ($TBT ms). Target is < 500 ms."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Performance budgets exceeded. Blocking the CI pipeline."
            exit 1
          else
            echo "✅ All performance budgets passed!"
          fi
